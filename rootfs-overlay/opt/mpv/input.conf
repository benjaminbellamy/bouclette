# Chapter navigation via PC remote
PGUP    add chapter -1
PGDWN   add chapter 1

# Play / Pause
TAB     cycle pause

# Previous / next file in playlist
LEFT    playlist-prev
RIGHT   playlist-next

# Volume — try CEC first (TV/AVR), fall back to mpv software volume
VOLUME_UP     script-message bouclette-volume-up
VOLUME_DOWN   script-message bouclette-volume-down

# Emergency quit (remove for strict kiosk lockdown)
q       quit
ESC     quit
